name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/clinics-plateform-api:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  staging:
    needs: image
    # Skipped (not failed) until the DigitalOcean app and token are configured: repository variable STAGING_APP_ID
    # and environment secret DO_TOKEN (docs/runbooks/deploy.md).
    if: vars.STAGING_APP_ID != ''
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with: { token: "${{ secrets.DO_TOKEN }}" }
      - name: Roll out image to staging (pre-deploy job runs migrations)
        run: |
          doctl apps spec get "${{ vars.STAGING_APP_ID }}" > spec.yaml
          sed -i "s/tag: .*/tag: ${{ needs.image.outputs.tag }}/" spec.yaml
          doctl apps update "${{ vars.STAGING_APP_ID }}" --spec spec.yaml --wait

  production:
    # Promotion only after approval (SRS §2.2): the production environment requires reviewers.
    needs: [image, staging]
    if: vars.PRODUCTION_APP_ID != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with: { token: "${{ secrets.DO_TOKEN }}" }
      - run: |
          doctl apps spec get "${{ vars.PRODUCTION_APP_ID }}" > spec.yaml
          sed -i "s/tag: .*/tag: ${{ needs.image.outputs.tag }}/" spec.yaml
          doctl apps update "${{ vars.PRODUCTION_APP_ID }}" --spec spec.yaml --wait
