name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck, test (incl. MT-5 isolation suite)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      CHROMIUM_PATH: /usr/bin/google-chrome
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: RTL / i18n lint (LOC-1, LOC-2)
        run: node scripts/lint-rtl.mjs packages/ui/src apps/site/app apps/site/components apps/console/app apps/console/components
      - name: Build packages and services
        run: pnpm turbo run build --filter=@hf/shared --filter=@hf/db --filter=@hf/documents --filter=@hf/testkit --filter=@hf/api --filter=@hf/worker
      - name: Typecheck
        run: pnpm turbo run typecheck
      - name: Unit tests (shared domain)
        run: pnpm --filter @hf/shared test
      - name: Database RLS tests
        run: pnpm --filter @hf/db test
      - name: Documents (Chromium PDF)
        run: pnpm --filter @hf/documents test
      - name: API acceptance + isolation suite (blocks merge)
        run: pnpm --filter @hf/api test
      - name: Worker jobs
        run: pnpm --filter @hf/worker test

  web:
    name: Build web (Vercel targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hf/shared build
      - run: pnpm --filter @hf/site build
      - run: pnpm --filter @hf/console build
      - run: pnpm --filter @hf/mobile typecheck

  gate:
    name: Quality gate (NFR-2 smoke, axe, RTL, Lighthouse)
    runs-on: ubuntu-latest
    needs: [test, web]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      DATABASE_APP_PASSWORD: hf_api_ci
      DATABASE_URL: postgres://hf_api:hf_api_ci@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379
      AUTH_DEV_SECRET: ci-only-dev-secret-not-for-production-0123456789
      OTP_DEV_ECHO: "true"
      RATE_LIMIT_PUBLIC_PER_MIN: "10000000"
      CHROMIUM_PATH: /usr/bin/google-chrome
      API_URL: http://localhost:4000
      ORG_SLUG: demo
      AUTH_MODE: dev
      SESSION_SECRET: ci-only-session-secret-0123456789abcdef
      COOKIE_INSECURE: "1"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@hf/api --filter=@hf/site --filter=@hf/console
      - name: Migrate and seed demo data
        run: pnpm --filter @hf/db migrate && pnpm --filter @hf/db seed --demo
      - name: Start API, site and console
        run: |
          (cd apps/api && nohup node dist/main.js > ../../api.log 2>&1 &)
          (cd apps/site && nohup pnpm start > ../../site.log 2>&1 &)
          (cd apps/console && CONSOLE_URL=http://localhost:3001 nohup pnpm start > ../../console.log 2>&1 &)
          if ! npx --yes wait-on -t 120000 http-get://localhost:4000/v1/public/org http-get://localhost:3000/ar http-get://localhost:3001/login; then
            for f in api.log site.log console.log; do echo "::group::$f"; tail -n 80 "$f"; echo "::endgroup::"; done
            exit 1
          fi
      - name: NFR-2 smoke (public read path)
        run: API=http://localhost:4000 VUS=100 DURATION=30 node scripts/perf.mjs
      - name: Accessibility, RTL and Lighthouse
        run: OUT=ui-report node packages/ui-tests/run.mjs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-gate
          path: |
            ui-report
            api.log
            site.log
            console.log

  security:
    name: Security scanning (SEC-9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - name: Secret scanning
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Semgrep
        run: docker run --rm -v "$PWD:/src" semgrep/semgrep semgrep scan --config p/typescript --config p/nodejs --config p/secrets --config p/owasp-top-ten --error --exclude node_modules
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: pnpm }
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

  image:
    name: API/worker image
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with: { context: ., file: apps/api/Dockerfile, push: false, tags: "healthflow-api:ci", cache-from: type=gha, cache-to: "type=gha,mode=max" }
