# Local development stack (SRS §2.2 "dev"). Synthetic data only.
name: healthflow
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: healthflow
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 20 }

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: ["8080:8080"]
    volumes: ["./infra/keycloak:/opt/keycloak/data/import:ro"]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: minio-secret }
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]

  clamav:
    image: clamav/clamav:1.4
    ports: ["3310:3310"]

  mailpit:
    image: axllent/mailpit:v1.24
    ports: ["8025:8025", "1025:1025"]

  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["node", "packages/db/dist/migrate-cli.js"]
    environment:
      DATABASE_ADMIN_URL: postgres://postgres:postgres@postgres:5432/healthflow
      DATABASE_APP_USER: hf_api
      DATABASE_APP_PASSWORD: hf_api
    depends_on: { postgres: { condition: service_healthy } }

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: [.env.example]
    environment:
      DATABASE_URL: postgres://hf_api:hf_api@postgres:5432/healthflow
      REDIS_URL: redis://redis:6379
      CLAMD_HOST: clamav
      SMTP_URL: smtp://mailpit:1025
    ports: ["4000:4000"]
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_started } }

  worker:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["node", "apps/worker/dist/main.js"]
    env_file: [.env.example]
    environment:
      DATABASE_URL: postgres://hf_api:hf_api@postgres:5432/healthflow
      REDIS_URL: redis://redis:6379
      SMTP_URL: smtp://mailpit:1025
    depends_on: { migrate: { condition: service_completed_successfully } }

volumes:
  pgdata: {}
  minio: {}
