packages:
  - "apps/*"
  - "packages/*"
onlyBuiltDependencies:
  - "@swc/core"
  - esbuild
  - sharp
  - "@nestjs/core"
# Supply chain (SEC-9): wait 7 days before installing newly published versions, refuse transitive
# dependencies from git/tarball sources, and refuse updates that weaken a package's publishing trust.
minimumReleaseAge: 10080
blockExoticSubdeps: true
trustPolicy: no-downgrade
# Security overrides: postcss inside Next.js (GHSA-6g55-p6wh-862q, GHSA-r28c-9q8g-f849).
overrides:
  "postcss@<8.5.18": 8.5.33
